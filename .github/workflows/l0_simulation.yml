name: L0-ISM Formal Verification Pipeline

on: [push, pull_request]

jobs:
  run-l0-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install z3-solver

      - name: Run Millennium Invariants Formal Proofs
        run: |
          python scripts/l0_ism_millennium_invariants_proof.py

      - name: Run Chronology Protection Flux Proof
        run: |
          python scripts/l0_ism_chronology_flux_proof.py
