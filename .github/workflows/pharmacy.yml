name: Invariant Bytes Proof of Concept (Pharmacy)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie z zakładki Actions

jobs:
  run-pharmacy-simulation:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja środowiska Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalacja bibliotek matematycznych
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: L0 Enclave - Uruchomienie Symulatora Apteki (Green Leaf)
      run: python scripts/symulator_ib_pharmacy.py

    - name: Zapisanie dowodu inżynieryjnego (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: IB_Pharmacy_Proof
        path: ib_pharmacy_proof_of_concept.png
